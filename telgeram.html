<!DOCTYPE html>
<html lang="fa" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ابزار پیشرفته تنظیم وب‌هوک تلگرام</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        
        /* استایل سفارشی برای اسکرول‌بار */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        /* انیمیشن سایدبار */
        .sidebar-open { transform: translateX(0); }
        .sidebar-closed-rtl { transform: translateX(100%); }
        .sidebar-closed-ltr { transform: translateX(-100%); }
        .backdrop-visible { opacity: 1; visibility: visible; }
        .backdrop-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800 dark:text-slate-200 transition-colors duration-300 relative overflow-x-hidden">

    <div id="sidebarBackdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 transition-all duration-300 backdrop-hidden"></div>
    <div id="sidebar" class="fixed top-0 bottom-0 right-0 w-80 bg-white dark:bg-slate-800 shadow-2xl z-50 transition-transform duration-300 sidebar-closed-rtl border-l border-slate-200 dark:border-slate-700 flex flex-col ltr:right-auto ltr:left-0 ltr:border-l-0 ltr:border-r ltr:sidebar-closed-ltr">
        <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">
            <h2 class="font-bold text-lg" data-i18n="sidebar_title">ربات‌های من</h2>
            <button id="closeSidebarBtn" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="p-4 flex-1 overflow-y-auto" id="savedBotsList">
            <!-- لیست ربات‌ها اینجا رندر می‌شود -->
        </div>
        <div class="p-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50">
            <h3 class="font-bold text-sm mb-3" data-i18n="add_new_bot">ذخیره ربات جدید</h3>
            <input type="text" id="newBotAlias" placeholder="نام مستعار (مثلا: ربات فروشگاه)" class="w-full px-3 py-2 text-sm bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none mb-2" data-i18n-ph="alias_ph">
            <button id="saveCurrentBotBtn" class="w-full bg-blue-100 hover:bg-blue-200 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 py-2 rounded-lg text-sm font-bold transition-colors" data-i18n="btn_save_bot">ذخیره اطلاعات فرم فعلی</button>
        </div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden border border-slate-100 dark:border-slate-700 transition-colors duration-300 relative z-10">
        
        <div class="bg-blue-600 dark:bg-blue-700 px-6 py-6 text-center text-white relative transition-colors duration-300">
            <!-- Toggles (Lang & Theme & Sidebar) -->
            <div class="absolute top-4 flex gap-2 rtl:right-4 ltr:left-4">
                <button id="openSidebarBtn" class="p-2 bg-white/20 hover:bg-white/30 rounded-full transition-colors tooltip flex items-center justify-center" title="ربات‌های من">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <button id="themeToggle" class="p-2 bg-white/20 hover:bg-white/30 rounded-full transition-colors tooltip flex items-center justify-center" title="تغییر تم">
                    <svg id="themeIconDark" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg id="themeIconLight" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
            </div>
            <div class="absolute top-4 flex gap-2 rtl:left-4 ltr:right-4">
                <button id="langToggle" class="p-2 bg-white/20 hover:bg-white/30 rounded-full transition-colors text-sm font-bold w-10 text-center flex items-center justify-center">
                    EN
                </button>
            </div>

            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 text-blue-100" fill="currentColor" viewBox="0 0 24 24">
                <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.896-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
            </svg>
            <h1 class="text-2xl font-bold" data-i18n="app_title">پنل مدیریت وب‌هوک تلگرام</h1>
            <p class="text-blue-100 text-sm mt-2" data-i18n="app_desc">توکن ربات و آدرس را وارد کنید</p>
        </div>

        <div class="p-6">
            <div id="botProfileCard" class="hidden mb-6 p-4 rounded-xl bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-slate-700/50 dark:to-blue-900/20 border border-blue-100 dark:border-blue-800/50 flex items-center gap-4 fade-in">
                <div class="w-12 h-12 rounded-full bg-blue-200 dark:bg-blue-600 flex items-center justify-center text-blue-700 dark:text-white font-bold text-xl flex-shrink-0" id="botAvatarInitials">B</div>
                <div class="flex-1 overflow-hidden">
                    <h3 id="botCardName" class="font-bold text-lg text-slate-800 dark:text-white truncate">نام ربات</h3>
                    <p id="botCardUsername" class="text-sm text-blue-600 dark:text-blue-400 truncate">@username</p>
                </div>
                <div class="text-xs text-slate-500 dark:text-slate-400 bg-white dark:bg-slate-800 px-2 py-1 rounded shadow-sm border border-slate-100 dark:border-slate-700 whitespace-nowrap">
                    ID: <span id="botCardId" class="font-mono">...</span>
                </div>
            </div>

            <form id="webhookForm" class="space-y-5">
                
                <!-- Basic Settings -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <div class="flex justify-between items-end mb-1">
                            <label for="botToken" class="block text-sm font-semibold text-slate-700 dark:text-slate-300" data-i18n="label_token">توکن ربات (Bot Token):</label>
                            <button type="button" id="getMeBtn" class="text-xs text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1 transition-opacity">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                <span data-i18n="btn_get_profile">دریافت پروفایل</span>
                            </button>
                        </div>
                        <input type="text" id="botToken" required list="tokenHistory"
                               placeholder="123456:ABC-DEF..." 
                               class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-left dir-ltr placeholder-slate-400 dark:placeholder-slate-500 font-mono text-sm dark:text-white">
                        <datalist id="tokenHistory"></datalist>
                        <p id="tokenError" class="text-xs text-red-500 mt-1 hidden" data-i18n="err_token_format">فرمت توکن نامعتبر است.</p>
                    </div>

                    <div>
                        <label for="webhookUrl" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1" data-i18n="label_url">آدرس وب‌هوک (URL):</label>
                        <input type="url" id="webhookUrl" required list="urlHistory"
                               placeholder="https://your-domain.com/path" 
                               class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-left dir-ltr placeholder-slate-400 dark:placeholder-slate-500 font-mono text-sm dark:text-white">
                        <datalist id="urlHistory"></datalist>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1" data-i18n="desc_https">آدرس باید حتماً با https شروع شود.</p>
                    </div>
                </div>

                <div class="border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden transition-colors">
                    <button type="button" id="toggleAdvanced" class="w-full bg-slate-100 dark:bg-slate-700 px-4 py-3 flex justify-between items-center text-sm font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                        <span data-i18n="advanced_options">تنظیمات پیشرفته (اختیاری)</span>
                        <svg id="advancedChevron" class="w-5 h-5 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    
                    <div id="advancedSettings" class="hidden p-4 space-y-4 bg-white dark:bg-slate-800">
                        <!-- Drop Pending Updates -->
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="dropPending" class="w-4 h-4 text-blue-600 rounded border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:ring-blue-500">
                            <label for="dropPending" class="text-sm font-medium text-slate-700 dark:text-slate-300" data-i18n="label_drop_pending">حذف آپدیت‌های در انتظار (Drop Pending Updates)</label>
                        </div>

                        <!-- Secret Token & IP -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="secretToken" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-i18n="label_secret">توکن امنیتی (Secret Token):</label>
                                <input type="text" id="secretToken" pattern="[a-zA-Z0-9_-]+" placeholder="MySecret_123" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-1 focus:ring-blue-500 outline-none text-left dir-ltr font-mono text-xs dark:text-white">
                                <p class="text-[10px] text-slate-500 mt-1" data-i18n="desc_secret">فقط حروف انگلیسی، عدد، - و _ مجاز است.</p>
                            </div>
                            <div>
                                <label for="ipAddress" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-i18n="label_ip">آی‌پی ثابت (IP Address):</label>
                                <input type="text" id="ipAddress" placeholder="192.168.1.1" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-1 focus:ring-blue-500 outline-none text-left dir-ltr font-mono text-xs dark:text-white">
                            </div>
                        </div>

                        <!-- Max Connections & Allowed Updates -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="maxConnections" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-i18n="label_max_conn">حداکثر اتصال همزمان (1-100):</label>
                                <input type="number" id="maxConnections" min="1" max="100" placeholder="40" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-1 focus:ring-blue-500 outline-none text-left dir-ltr font-mono text-xs dark:text-white">
                            </div>
                            <div>
                                <label for="allowedUpdates" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-i18n="label_allowed">آپدیت‌های مجاز (چندانتخابی):</label>
                                <select id="allowedUpdates" multiple class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-1 focus:ring-blue-500 outline-none text-left dir-ltr font-mono text-xs dark:text-white h-20">
                                    <option value="message">message</option>
                                    <option value="edited_message">edited_message</option>
                                    <option value="channel_post">channel_post</option>
                                    <option value="callback_query">callback_query</option>
                                    <option value="my_chat_member">my_chat_member</option>
                                </select>
                                <p class="text-[10px] text-slate-500 mt-1" data-i18n="desc_allowed">برای انتخاب چند مورد Ctrl/Cmd را نگه دارید.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                    <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm focus:ring-4 focus:ring-blue-200 dark:focus:ring-blue-900">
                        <span id="btnText" data-i18n="btn_set">ثبت وب‌هوک</span>
                        <svg id="loadingIcon" class="hidden w-5 h-5 text-white animate-spin-custom" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </button>
                    <button type="button" id="deleteWebhookBtn" class="sm:w-1/4 bg-red-100 hover:bg-red-200 text-red-700 dark:bg-red-900/30 dark:hover:bg-red-900/50 dark:text-red-400 font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 border border-red-200 dark:border-red-800">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        <span class="hidden sm:inline" data-i18n="btn_delete">حذف</span>
                    </button>
                    <button type="button" id="testWebhookBtn" class="sm:w-1/4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 dark:bg-emerald-900/30 dark:hover:bg-emerald-900/50 dark:text-emerald-400 font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 border border-emerald-200 dark:border-emerald-800" title="تست ارسال پیام">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <span class="hidden sm:inline" data-i18n="btn_test">تست سرور</span>
                    </button>
                </div>
            </form>

            <div id="resultContainer" class="mt-6 hidden relative">
                <button id="copyLogBtn" class="absolute top-3 left-3 (در-حالت-rtl) p-1.5 rounded-md hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-500 dark:text-slate-400 transition-colors tooltip rtl:left-3 rtl:right-auto ltr:right-3 ltr:left-auto" style="z-index: 10;" title="کپی لاگ">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
                <div id="resultBox" class="p-4 rounded-lg border flex items-start gap-3">
                    <div id="resultIcon" class="mt-0.5 flex-shrink-0"></div>
                    <div class="flex-1 overflow-hidden">
                        <h3 id="resultTitle" class="font-bold text-sm mb-1"></h3>
                        <p id="resultMessage" class="text-sm break-all leading-relaxed whitespace-pre-line"></p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bg-slate-50 dark:bg-slate-800 px-6 py-4 border-t border-slate-100 dark:border-slate-700 text-center transition-colors duration-300">
             <button id="checkWebhookBtn" class="text-sm text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-medium transition-colors border-b border-transparent hover:border-current inline-flex items-center gap-1">
                 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                 <span data-i18n="btn_info">بررسی وضعیت پیشرفته (GetWebhookInfo)</span>
             </button>
        </div>
    </div>

    <script>
        // Dictionary for i18n
        const dict = {
            fa: {
                app_title: "پنل مدیریت وب‌هوک تلگرام",
                app_desc: "توکن ربات و آدرس وب‌هوک را وارد کنید",
                label_token: "توکن ربات (Bot Token):",
                btn_get_profile: "دریافت پروفایل",
                label_url: "آدرس وب‌هوک (URL):",
                err_token_format: "فرمت توکن نامعتبر است. باید شامل عدد و : باشد.",
                desc_https: "آدرس باید حتماً با https شروع شود.",
                advanced_options: "تنظیمات پیشرفته (اختیاری)",
                label_drop_pending: "حذف آپدیت‌های در انتظار (Drop Pending Updates)",
                label_secret: "توکن امنیتی (Secret Token):",
                desc_secret: "فقط حروف انگلیسی، عدد، - و _ مجاز است.",

                label_max_conn: "حداکثر اتصال همزمان (1-100):",

                desc_allowed: "برای انتخاب چند مورد Ctrl/Cmd را نگه دارید.",
                btn_set: "ثبت وب‌هوک",
                btn_delete: "حذف",
                btn_test: "تست سرور",
                btn_info: "بررسی وضعیت پیشرفته (GetWebhookInfo)",
                msg_loading: "در حال پردازش...",
                err_input: "لطفا توکن و آدرس را وارد کنید.",
                err_https: "آدرس حتما باید با https:// شروع شود.",
                err_network: "ارتباط با تلگرام برقرار نشد. اینترنت را چک کنید.",

                sidebar_title: "ربات‌های من",
                add_new_bot: "ذخیره ربات جدید",
                alias_ph: "نام مستعار (مثلا: ربات فروشگاه)",
                btn_save_bot: "ذخیره اطلاعات فرم فعلی",
                bot_saved: "ربات در لیست ذخیره شد.",
                bot_deleted: "ربات از لیست حذف شد.",
                test_sent: "پیام تست ارسال شد.",
                test_success: "سرور شما با موفقیت درخواست را دریافت کرد (کد 200).",

            en: {

                err_interpreter_title: "💡 Error Guide:"

        };

        const errorGuide = {
            fa: {
                '401': "توکن ربات نامعتبر است یا منقضی شده است. لطفا توکن را از BotFather مجدد کپی کنید.",

            },
            en: {
                '401': "Bot token is unauthorized or invalid. Check it with BotFather.",
                '404': "Not found. Token is wrong or API endpoint is unreachable.",
                '400': "Bad Request. Webhook URL format is invalid or using unsupported port (allowed: 443, 80, 88, 8443).",
                'ssl': "Your server's SSL certificate is invalid or self-signed without proper Telegram configuration.",
                'connection': "Telegram cannot connect to your server. Check your firewall settings for Telegram IPs."
            }
        };

        let currentLang = 'fa';

        const icons = {
            success: `<svg class="w-6 h-6 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
            error: `<svg class="w-6 h-6 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
            info: `<svg class="w-6 h-6 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
        };

        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const form = document.getElementById('webhookForm');
            const toggleAdvanced = document.getElementById('toggleAdvanced');
            const advancedSettings = document.getElementById('advancedSettings');
            const advancedChevron = document.getElementById('advancedChevron');
            const resultContainer = document.getElementById('resultContainer');
            const resultBox = document.getElementById('resultBox');
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');
            const botTokenInput = document.getElementById('botToken');
            
            // New DOM Elements
            const sidebar = document.getElementById('sidebar');
            const sidebarBackdrop = document.getElementById('sidebarBackdrop');
            const savedBotsList = document.getElementById('savedBotsList');
            const botProfileCard = document.getElementById('botProfileCard');

            // Initialization
            initTheme();
            initHistory();
            initSavedBots();
            updateLangUI();

            // --- Theme Logic ---
            document.getElementById('themeToggle').addEventListener('click', () => {
                const html = document.documentElement;
                const isDark = html.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                document.getElementById('themeIconDark').classList.toggle('hidden', !isDark);
                document.getElementById('themeIconLight').classList.toggle('hidden', isDark);
            });

            function initTheme() {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.getElementById('themeIconDark').classList.remove('hidden');
                    document.getElementById('themeIconLight').classList.add('hidden');
                }
            }

            // --- Language Logic ---
            document.getElementById('langToggle').addEventListener('click', (e) => {
                currentLang = currentLang === 'fa' ? 'en' : 'fa';
                e.target.textContent = currentLang === 'fa' ? 'EN' : 'FA';
                document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
                
                // Adjust absolute positions for LTR/RTL
                const copyBtn = document.getElementById('copyLogBtn');
                if(currentLang === 'en') {
                    copyBtn.classList.replace('left-3', 'right-3');
                } else {
                    copyBtn.classList.replace('right-3', 'left-3');
                }
                updateLangUI();
            });

            function updateLangUI() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dict[currentLang][key]) {
                        if (el.tagName === 'INPUT' && el.type !== 'button' && el.type !== 'submit') {
                            // If it's an input with placeholder, we might want to update it, 
                            // but for simplicity we keep hardcoded placeholders or handle them manually.
                        } else {
                            // Preserve SVG if button has children
                            if(el.children.length > 0) {
                                // Find text node and replace
                                Array.from(el.childNodes).forEach(node => {
                                    if(node.nodeType === 3 && node.nodeValue.trim() !== "") {
                                        node.nodeValue = " " + dict[currentLang][key] + " ";
                                    }
                                });
                            } else {
                                el.textContent = dict[currentLang][key];
                            }
                        }
                    }
                    
                    // Update Placeholders specifically
                    const phKey = el.getAttribute('data-i18n-ph');
                    if (phKey && dict[currentLang][phKey]) {
                        el.placeholder = dict[currentLang][phKey];
                    }
                });
            }

            // --- Sidebar & Saved Bots Logic ---
            function toggleSidebar() {
                const isRtl = document.documentElement.dir === 'rtl';
                if(sidebarBackdrop.classList.contains('backdrop-hidden')) {
                    // Open
                    sidebarBackdrop.classList.remove('backdrop-hidden');
                    sidebarBackdrop.classList.add('backdrop-visible');
                    sidebar.classList.remove('sidebar-closed-rtl', 'sidebar-closed-ltr');
                    sidebar.classList.add('sidebar-open');
                } else {
                    // Close
                    sidebarBackdrop.classList.remove('backdrop-visible');
                    sidebarBackdrop.classList.add('backdrop-hidden');
                    sidebar.classList.remove('sidebar-open');
                    sidebar.classList.add(isRtl ? 'sidebar-closed-rtl' : 'sidebar-closed-ltr');
                }
            }

            document.getElementById('openSidebarBtn').addEventListener('click', toggleSidebar);
            document.getElementById('closeSidebarBtn').addEventListener('click', toggleSidebar);
            sidebarBackdrop.addEventListener('click', toggleSidebar);

            function initSavedBots() {
                renderSavedBots();
            }

            function renderSavedBots() {
                const bots = JSON.parse(localStorage.getItem('savedBots') || '[]');
                savedBotsList.innerHTML = '';
                if(bots.length === 0) {
                    savedBotsList.innerHTML = `<div class="text-center text-slate-500 text-sm py-8 opacity-70">لیست خالی است</div>`;
                    return;
                }

                bots.forEach((bot, index) => {
                    const item = document.createElement('div');
                    item.className = 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-3 mb-2 flex justify-between items-center group';
                    item.innerHTML = `
                        <div class="cursor-pointer flex-1 overflow-hidden" onclick="loadSavedBot(${index})">
                            <div class="font-bold text-sm text-slate-800 dark:text-slate-200 truncate">${bot.alias}</div>
                            <div class="text-xs text-slate-500 truncate font-mono mt-0.5">${bot.url}</div>
                        </div>
                        <button onclick="deleteSavedBot(${index})" class="text-slate-400 hover:text-red-500 p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                    savedBotsList.appendChild(item);
                });
            }

            window.loadSavedBot = function(index) {
                const bots = JSON.parse(localStorage.getItem('savedBots') || '[]');
                const bot = bots[index];
                if(bot) {
                    document.getElementById('botToken').value = bot.token || '';
                    document.getElementById('webhookUrl').value = bot.url || '';
                    toggleSidebar();
                    if(bot.token) document.getElementById('getMeBtn').click();
                }
            };

            window.deleteSavedBot = function(index) {
                let bots = JSON.parse(localStorage.getItem('savedBots') || '[]');
                bots.splice(index, 1);
                localStorage.setItem('savedBots', JSON.stringify(bots));
                renderSavedBots();
            };

            document.getElementById('saveCurrentBotBtn').addEventListener('click', () => {
                const alias = document.getElementById('newBotAlias').value.trim();
                const token = document.getElementById('botToken').value.trim();
                const url = document.getElementById('webhookUrl').value.trim();
                
                if(!alias || !token) {
                    showMessage('error', dict[currentLang].error_title, "نام مستعار و توکن الزامی است.");
                    return;
                }

                let bots = JSON.parse(localStorage.getItem('savedBots') || '[]');
                bots.push({ alias, token, url });
                localStorage.setItem('savedBots', JSON.stringify(bots));
                document.getElementById('newBotAlias').value = '';
                renderSavedBots();
                showMessage('success', dict[currentLang].success_title, dict[currentLang].bot_saved);
            });

            // --- Error Interpreter ---
            function interpretError(description, code) {
                if(!description) return "";
                const langGuide = errorGuide[currentLang];
                let interpretation = "";
                
                if (code == 401) interpretation = langGuide['401'];
                else if (code == 404) interpretation = langGuide['404'];
                else if (code == 400) interpretation = langGuide['400'];
                else if (description.toLowerCase().includes('ssl')) interpretation = langGuide['ssl'];
                else if (description.toLowerCase().includes('connection')) interpretation = langGuide['connection'];

                if (interpretation) {
                    return `\n\n${dict[currentLang].err_interpreter_title}\n${interpretation}`;
                }
                return "";
            }

            // --- API Call: Get Me (Bot Profile) ---
            document.getElementById('getMeBtn').addEventListener('click', async () => {
                const token = botTokenInput.value.trim();
                if (!token) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_token_format); return;
                }

                setLoading('getMeBtn', true);
                botProfileCard.classList.add('hidden');

                try {
                    const response = await fetch(`https://api.telegram.org/bot${token}/getMe`);
                    const data = await response.json();

                    if (response.ok && data.ok) {
                        const bot = data.result;
                        document.getElementById('botCardName').textContent = bot.first_name;
                        document.getElementById('botCardUsername').textContent = `@${bot.username}`;
                        document.getElementById('botCardId').textContent = bot.id;
                        document.getElementById('botAvatarInitials').textContent = bot.first_name.charAt(0).toUpperCase();
                        
                        botProfileCard.classList.remove('hidden');
                        resultContainer.classList.add('hidden');
                    } else {
                        const interpretedMsg = interpretError(data.description, data.error_code);
                        showMessage('error', `${dict[currentLang].error_title} (${data.error_code || 'Err'})`, data.description + interpretedMsg);
                    }
                } catch (error) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_network);
                } finally {
                    setLoading('getMeBtn', false);
                }
            });

            // --- History Logic (Local Storage) ---
            function initHistory() {
                populateDatalist('tokens', 'tokenHistory');
                populateDatalist('urls', 'urlHistory');
            }

            function saveToHistory(key, value) {
                if(!value) return;
                let history = JSON.parse(localStorage.getItem(key) || '[]');
                if (!history.includes(value)) {
                    history.unshift(value); // Add to beginning
                    if(history.length > 5) history.pop(); // Keep max 5
                    localStorage.setItem(key, JSON.stringify(history));
                    populateDatalist(key, key === 'tokens' ? 'tokenHistory' : 'urlHistory');
                }
            }

            function populateDatalist(storageKey, datalistId) {
                const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
                const datalist = document.getElementById(datalistId);
                datalist.innerHTML = '';
                history.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item;
                    datalist.appendChild(option);
                });
            }

            // --- Validation Logic ---
            botTokenInput.addEventListener('blur', () => {
                const token = botTokenInput.value.trim();
                const errEl = document.getElementById('tokenError');
                // Basic check: Numbers : Any chars
                if(token && !/^[0-9]+:[a-zA-Z0-9_-]+$/.test(token)) {
                    errEl.classList.remove('hidden');
                } else {
                    errEl.classList.add('hidden');
                }
            });

            // --- UI Interaction ---
            toggleAdvanced.addEventListener('click', () => {
                advancedSettings.classList.toggle('hidden');
                advancedChevron.classList.toggle('rotate-180');
            });

            document.getElementById('copyLogBtn').addEventListener('click', () => {
                const textToCopy = `${resultTitle.textContent}\n${resultMessage.textContent}`;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalHTML = resultIcon.innerHTML;
                    resultIcon.innerHTML = `<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                    setTimeout(() => { resultIcon.innerHTML = originalHTML; }, 2000);
                });
            });

            function showMessage(type, title, message) {
                resultBox.className = 'p-4 rounded-lg border flex items-start gap-3 fade-in';
                
                if (type === 'success') {
                    resultBox.classList.add('bg-green-50', 'border-green-200', 'text-green-800', 'dark:bg-green-900/20', 'dark:border-green-800', 'dark:text-green-300');
                    resultIcon.innerHTML = icons.success;
                } else if (type === 'error') {
                    resultBox.classList.add('bg-red-50', 'border-red-200', 'text-red-800', 'dark:bg-red-900/20', 'dark:border-red-800', 'dark:text-red-300');
                    resultIcon.innerHTML = icons.error;
                } else {
                    resultBox.classList.add('bg-blue-50', 'border-blue-200', 'text-blue-800', 'dark:bg-blue-900/20', 'dark:border-blue-800', 'dark:text-blue-300');
                    resultIcon.innerHTML = icons.info;
                }

                resultTitle.textContent = title;
                resultMessage.textContent = message;
                resultContainer.classList.remove('hidden');
            }

            function setLoading(btnId, isLoading) {
                const btn = document.getElementById(btnId);
                const isSubmit = btnId === 'submitBtn';
                
                if (isLoading) {
                    btn.disabled = true;
                    btn.classList.add('opacity-75', 'cursor-not-allowed');
                    if(isSubmit) {
                        document.getElementById('btnText').textContent = dict[currentLang].msg_loading;
                        document.getElementById('loadingIcon').classList.remove('hidden');
                    } else {
                        btn.dataset.originalText = btn.innerHTML;
                        btn.textContent = dict[currentLang].msg_loading;
                    }
                } else {
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                    if(isSubmit) {
                        document.getElementById('btnText').textContent = dict[currentLang].btn_set;
                        document.getElementById('loadingIcon').classList.add('hidden');
                    } else {
                        btn.innerHTML = btn.dataset.originalText;
                    }
                }
            }

            // --- API Call: Set Webhook ---
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const token = document.getElementById('botToken').value.trim();
                const url = document.getElementById('webhookUrl').value.trim();
                
                if (!token || !url) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_input); return;
                }
                if (!url.startsWith('https://')) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_https); return;
                }
                if(!/^[0-9]+:[a-zA-Z0-9_-]+$/.test(token)) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_token_format); return;
                }

                // Gather advanced params
                const dropPending = document.getElementById('dropPending').checked;
                const secretToken = document.getElementById('secretToken').value.trim();
                const ipAddress = document.getElementById('ipAddress').value.trim();
                const maxConnections = document.getElementById('maxConnections').value;
                const allowedUpdatesSelect = document.getElementById('allowedUpdates');
                const allowedUpdates = Array.from(allowedUpdatesSelect.selectedOptions).map(opt => opt.value);

                resultContainer.classList.add('hidden');
                setLoading('submitBtn', true);

                try {
                    let apiUrl = `https://api.telegram.org/bot${token}/setWebhook?url=${encodeURIComponent(url)}`;
                    if (dropPending) apiUrl += `&drop_pending_updates=true`;
                    if (secretToken) apiUrl += `&secret_token=${encodeURIComponent(secretToken)}`;
                    if (ipAddress) apiUrl += `&ip_address=${encodeURIComponent(ipAddress)}`;
                    if (maxConnections) apiUrl += `&max_connections=${maxConnections}`;
                    if (allowedUpdates.length > 0) apiUrl += `&allowed_updates=${encodeURIComponent(JSON.stringify(allowedUpdates))}`;

                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    if (response.ok && data.ok) {
                        saveToHistory('tokens', token);
                        saveToHistory('urls', url);
                        showMessage('success', dict[currentLang].success_title, data.description || 'Webhook was set successfully.');
                    } else {
                        const interpretedMsg = interpretError(data.description, data.error_code);
                        showMessage('error', `${dict[currentLang].error_title} (${data.error_code || 'Err'})`, data.description + interpretedMsg);
                    }
                } catch (error) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_network);
                } finally {
                    setLoading('submitBtn', false);
                }
            });

            // --- API Call: Delete Webhook ---
            document.getElementById('deleteWebhookBtn').addEventListener('click', async () => {
                const token = document.getElementById('botToken').value.trim();
                if (!token) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_token_format); return;
                }
                const dropPending = document.getElementById('dropPending').checked;
                
                resultContainer.classList.add('hidden');
                setLoading('deleteWebhookBtn', true);

                try {
                    let apiUrl = `https://api.telegram.org/bot${token}/deleteWebhook`;
                    if(dropPending) apiUrl += `?drop_pending_updates=true`;
                    
                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    if (response.ok && data.ok) {
                        showMessage('success', dict[currentLang].success_title, data.description || 'Webhook deleted.');
                    } else {
                        const interpretedMsg = interpretError(data.description, data.error_code);
                        showMessage('error', dict[currentLang].error_title, data.description + interpretedMsg);
                    }
                } catch (error) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_network);
                } finally {
                    setLoading('deleteWebhookBtn', false);
                }
            });

            // --- API Call: Get Webhook Info ---
            document.getElementById('checkWebhookBtn').addEventListener('click', async () => {
                const token = document.getElementById('botToken').value.trim();
                if (!token) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_token_format); return;
                }

                resultContainer.classList.add('hidden');
                setLoading('checkWebhookBtn', true);

                try {
                    const apiUrl = `https://api.telegram.org/bot${token}/getWebhookInfo`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    if (response.ok && data.ok) {
                        const info = data.result;
                        if (info.url) {
                            let msg = `URL: ${info.url}\n`;
                            msg += `${dict[currentLang].pending}: ${info.pending_update_count}\n`;
                            msg += `Custom IP: ${info.ip_address ? dict[currentLang].yes : dict[currentLang].no}\n`;
                            msg += `Max Connections: ${info.max_connections || 40}\n`;
                            
                            if(info.last_error_date) {
                                const errDate = new Date(info.last_error_date * 1000).toLocaleString(currentLang === 'fa' ? 'fa-IR' : 'en-US');
                                msg += `\n❌ ${dict[currentLang].last_err_date}: ${errDate}`;
                                msg += `\n❌ ${dict[currentLang].last_err_msg}: ${info.last_error_message}`;
                                msg += interpretError(info.last_error_message, 0); // Interpret info error
                            }
                            showMessage('info', dict[currentLang].info_title, msg);
                        } else {
                            showMessage('info', dict[currentLang].info_title, dict[currentLang].no_webhook);
                        }
                    } else {
                        const interpretedMsg = interpretError(data.description, data.error_code);
                        showMessage('error', dict[currentLang].error_title, data.description + interpretedMsg);
                    }
                } catch (error) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_network);
                } finally {
                    setLoading('checkWebhookBtn', false);
                }
            });
            
            // --- API Call: Test Webhook (Simulator) ---
            document.getElementById('testWebhookBtn').addEventListener('click', async () => {
                const url = document.getElementById('webhookUrl').value.trim();
                if (!url || !url.startsWith('https://')) {
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].err_https); return;
                }

                setLoading('testWebhookBtn', true);
                
                // Mock Telegram Update payload
                const mockPayload = {
                    update_id: Math.floor(Math.random() * 100000000),
                    message: {
                        message_id: 1,
                        from: { id: 123456789, is_bot: false, first_name: "TestUser", language_code: "en" },
                        chat: { id: 123456789, first_name: "TestUser", type: "private" },
                        date: Math.floor(Date.now() / 1000),
                        text: "/start"
                    }
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(document.getElementById('secretToken').value ? {'X-Telegram-Bot-Api-Secret-Token': document.getElementById('secretToken').value} : {})
                        },
                        body: JSON.stringify(mockPayload)
                    });

                    if (response.ok) {
                        showMessage('success', dict[currentLang].test_sent, dict[currentLang].test_success);
                    } else {
                        const msg = dict[currentLang].test_fail.replace('{code}', response.status);
                        showMessage('error', dict[currentLang].error_title, msg);
                    }
                } catch (error) {
                    // CORS or network failure
                    showMessage('error', dict[currentLang].error_title, dict[currentLang].test_cors + `\n\n(${error.message})`);
                } finally {
                    setLoading('testWebhookBtn', false);
                }
            });

        });
    </script>
</body>
</html>
